name: Feature request
description: Something GraphOWL should do, or do differently.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you are trying to solve
      description: Describe the situation first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: dropdown
    id: standards
    attributes:
      label: Does this relate to a standard or format?
      options:
        - No
        - RDF / SPARQL
        - SHACL
        - OWL
        - SKOS
        - Cypher / GQL
        - MCP
        - Other
